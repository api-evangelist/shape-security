aid: shape-security
name: Shape Security
description: 'Shape Security was an enterprise application-security company (backed by
  gv and wing-venture-capital) specializing in bot mitigation, credential-stuffing defense,
  and online-fraud prevention for login, checkout, and account-recovery flows. It was
  acquired by F5 in 2020 and its technology now ships as F5 Distributed Cloud Bot Defense;
  the shapesecurity.com domain 301-redirects wholesale into f5.com. Shape Security no
  longer operates an independent developer portal, public API, OpenAPI spec, or SDK
  surface of its own — its capabilities are delivered through the F5 Distributed Cloud
  platform. This profile is retained as an acquisition/lineage record in the API Evangelist
  network.'
